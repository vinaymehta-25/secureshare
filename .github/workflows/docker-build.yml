name: Trivy Scan

on:
  workflow_call:

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t secureshare-backend:latest ./backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureshare-backend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Build frontend image
        run: docker build -t secureshare-frontend:latest ./frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureshare-frontend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH  
